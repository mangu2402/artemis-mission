<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Artemis - Rumo à Lua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0d17; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { padding: 60px 0; text-align: center; }
        .artemis-logo { max-width: 250px; margin-bottom: 20px; }
        .gallery-img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; transition: 0.3s; }
        .gallery-img:hover { transform: scale(1.05); cursor: pointer; }
        footer { margin-top: 50px; padding: 20px; border-top: 1px solid #333; text-align: center; color: #888; }
    </style>
</head>
<body>

    <div class="container hero-section">
        <img src="https://www.nasa.gov/wp-content/uploads/2022/04/artemis_logo.png" alt="Logotipo Artemis" class="artemis-logo">
        
        <h1 class="display-4 fw-bold">Missão Artemis</h1>
        <p class="lead mx-auto" style="max-width: 700px;">
            Com a missão Artemis, a NASA levará a primeira mulher e a primeira pessoa de cor à Lua, utilizando tecnologias inovadoras para explorar mais da superfície lunar do que nunca.
        </p>
    </div>

    <div class="container">
        <h2 class="text-center mb-4">Galeria da Missão</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/NHQ202211160002/NHQ202211160002~thumb.jpg" class="gallery-img" alt="Lançamento SLS">
            </div>
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/PIA25455/PIA25455~thumb.jpg" class="gallery-img" alt="Cápsula Orion">
            </div>
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/iss068e025114/iss068e025114~thumb.jpg" class="gallery-img" alt="Terra vista da Orion">
            </div>
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/as11-40-5874/as11-40-5874~thumb.jpg" class="gallery-img" alt="Superfície da Lua">
            </div>
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/KSC-20220426-PH-KLS01_0006/KSC-20220426-PH-KLS01_0006~thumb.jpg" class="gallery-img" alt="Astronautas Artemis">
            </div>
            <div class="col-md-4">
                <img src="https://images-assets.nasa.gov/image/hsc_render_01/hsc_render_01~thumb.jpg" class="gallery-img" alt="Base Lunar">
            </div>
        </div>
    </div>

    <footer>
        <p>Projeto Artemis - Atividade de Git & Cloud Azure</p>
    </footer>

</body>
</html>
